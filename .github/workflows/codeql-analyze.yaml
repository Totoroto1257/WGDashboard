name: Copy Original Releases

on:
  workflow_dispatch: # Кнопка для ручного запуска

jobs:
  copy-releases:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout your fork
        uses: actions/checkout@v4

      - name: Copy releases from upstream
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Получаем список последних 20 релизов из оригинального репозитория WGDashboard
          releases=$(gh api repos/WGDashboard/WGDashboard/releases --jq '.[] | .tag_name')
          
          for tag in $releases; do
            echo "Проверяем релиз: $tag"
            
            # Проверяем, существует ли уже такой релиз у вас, чтобы не дублировать
            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Релиз $tag уже скопирован, пропускаем."
            else
              echo "Копируем релиз $tag..."
              
              # Получаем данные оригинального репозитория
              rel_data=$(gh api repos/WGDashboard/WGDashboard/releases/tags/$tag)
              title=$(echo "$rel_data" | jq -r '.name')
              body=$(echo "$rel_data" | jq -r '.body')
              prerelease=$(echo "$rel_data" | jq -r '.prerelease')
              
              # Создаем релиз в вашем форке на основе того же тега (он уже есть в истории git)
              if [ "$prerelease" = "true" ]; then
                gh release create "$tag" --title "$title" --notes "$body" --prerelease
              else
                gh release create "$tag" --title "$title" --notes "$body"
              fi
            fi
          done
